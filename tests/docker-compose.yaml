services:
  stream:
    image: 'tracexapp/stream'
    pull_policy: always
    environment:
      - STREAM_ENDPOINT_URL=s3://localhost:9002
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    ports:
      - 1081:1080
    restart: unless-stopped
  time-machine:
    image: tracexapp/worker
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5433/postgres
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
    restart: unless-stopped
  postgres:
    image: postgres:18.1
    command: ["postgres", "-p", "5433"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5433:5433
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    restart: unless-stopped
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9093,external://0.0.0.0:19093
      - --advertise-kafka-addr internal://redpanda:9093,external://localhost:19093
      - --pandaproxy-addr internal://0.0.0.0:8084,external://0.0.0.0:18084
      - --advertise-pandaproxy-addr internal://redpanda:8084,external://localhost:18084
      - --schema-registry-addr internal://0.0.0.0:8083,external://0.0.0.0:18083
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - 18083:18083
      - 18084:18084
      - 19093:19093
      - 19645:9644
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: 'pgsty/silo'
    command: server /data --address ":9000" --console-address ":9001"
    expose:
      - 9000
      - 9001
    ports:
      - 9002:9000
      - 9003:9001
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
  elastic:
    image: 'elasticsearch:7.14.2'
    expose:
      - 9200
    ports:
      - 9201:9200
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    healthcheck:
      interval: 5s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
  account:
    image: tracexapp/account
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres
      - minio
    ports:
      - 3003:3003
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - ACCOUNT_PORT=3003
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - WORKSPACE_LIMIT_PER_USER=100
      - DB_URL=${DB_URL}
      - REGION_INFO=|America
      - TRANSACTOR_URL=ws://transactor:3334;ws://tracex.local:3334
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
  workspace:
    image: tracexapp/workspace
    links:
      - postgres
      - minio
      - redpanda
    depends_on:
      redpanda:
        condition: service_started
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - SERVER_SECRET=secret
      - DB_URL=${DB_URL}
      - TRANSACTOR_URL=ws://transactor:3334;ws://tracex.local:3334
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - REGION=
      - ACCOUNTS_URL=http://account:3003
      - ACCOUNTS_DB_URL=${DB_URL}
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
    restart: unless-stopped
  front:
    image: tracexapp/front
    pull_policy: never
    links:
      - account
      - postgres
      - minio
      - elastic
      - collaborator
      - stats
      - transactor
    ports:
      - 8083:8083
    volumes:
      - ./branding-test.json:/app/dist/branding-test.json
    environment:
      - SERVER_PORT=8083
      - SERVER_SECRET=secret
      - ACCOUNTS_URL_INTERNAL=http://account:3003
      - ACCOUNTS_URL=http://tracex.local:3003
      - FILES_URL=http://tracex.local:4031/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=http://tracex.local:4031/upload/form-data/:workspace
      - DATALAKE_URL=http://tracex.local:4031
      - PREVIEW_URL=http://tracex.local:4031
      - ELASTIC_URL=http://elastic:9200
      - GMAIL_URL=http://tracex.local:8088
      - CALENDAR_URL=http://tracex.local:8095
      - REKONI_URL=http://rekoni:4007
      - TELEGRAM_URL=http://tracex.local:8086
      - COLLABORATOR_URL=ws://tracex.local:3079
      - PRINT_URL=http://tracex.local:4005
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_URL=http://tracex.local:8083/branding-test.json
      - STATS_URL=http://stats:4901
      - STATS_API=http://tracex.local:4901
  print:
    image: tracexapp/print
    pull_policy: never
    extra_hosts:
      - "tracex.local:host-gateway"
    depends_on:
      - front
      - account
      - datalake
      - transactor
    ports:
      - 4005:4005
    environment:
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - FRONT_URL=http://tracex.local:8083
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://stats:4901
  transactor:
    image: tracexapp/transactor
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
    links:
      - postgres
      - elastic
      - minio
      - rekoni
      - account
      - stats
      - redpanda
    ports:
      - 3334:3334
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - REGION=
      - SERVER_PORT=3334
      - SERVER_SECRET=secret
      - DB_URL=${DB_URL}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://tracex.local:8083
      - ACCOUNTS_URL=http://account:3003
      - COLLABORATOR_URL=http://collaborator:3079
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      - ENABLE_COMPRESSION=true
      - RATE_LIMIT_MAX=25000
      - RATE_LIMIT_WINDOW=1000
  collaborator:
    image: tracexapp/collaborator
    links:
      - postgres
      - minio
      - transactor
    ports:
      - 3079:3079
    environment:
      - COLLABORATOR_PORT=3079
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
    restart: unless-stopped
  rekoni:
    image: tracexapp/rekoni-service
    restart: on-failure
    ports:
      - 4007:4004
    environment:
      - STATS_URL=http://stats:4901

  fulltext:
    image: tracexapp/fulltext
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_started
      postgres:
        condition: service_started
      elastic:
        condition: service_healthy
    links:
      - elastic
      - postgres
      - rekoni
      - redpanda
    ports:
      - 4710:4710
    environment:
      - PORT=4710
      - SERVER_SECRET=secret
      - DB_URL=${DB_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - ELASTIC_INDEX_NAME=local_storage_index
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - REKONI_URL=http://rekoni:4007
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
  stats:
    image: tracexapp/stats
    ports:
      - 4901:4901
    environment:
      - PORT=4901
      - SERVER_SECRET=secret
    restart: unless-stopped
  datalake:
    image: tracexapp/datalake
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    ports:
      - 4031:4031
    environment:
      - PORT=4031
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
      - STREAM_URL=http://localhost:1081/recording
      - DB_URL=${DB_URL}
      - BUCKETS=blobs,eu|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin
      - QUEUE_CONFIG=${QUEUE_CONFIG}
    restart: unless-stopped

  # --- OTP login contour -------------------------------------------------
  # A separate account/front pair with MAIL_URL configured. MAIL_URL switches
  # the login UI to OTP mode and forces email confirmation on sign-up, so it
  # must not be enabled on the main account/front used by the other tests.
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - 8025:8025 # Web UI + REST API used by tests to read OTP codes
    restart: unless-stopped
  mail:
    image: tracexapp/mail
    pull_policy: never
    depends_on:
      - mailpit
    environment:
      - PORT=8097
      - SOURCE=noreply@tracex.local
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_TLS_MODE=ignore
      - MAIL_AUTH_TOKEN=${MAIL_AUTH_TOKEN}
    restart: unless-stopped
  account-otp:
    image: tracexapp/account
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      account:
        condition: service_started
      mail:
        condition: service_started
    ports:
      - 3004:3004
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    # QUEUE_CONFIG is intentionally omitted: sharing the consumer group with
    # the main account service would steal its queue messages.
    environment:
      - ACCOUNT_PORT=3004
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - WORKSPACE_LIMIT_PER_USER=100
      - DB_URL=${DB_URL}
      - REGION_INFO=|America
      - TRANSACTOR_URL=ws://transactor:3334;ws://tracex.local:3334
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
      - FRONT_URL=http://tracex.local:8084
      - MAIL_URL=http://mail:8097
      - MAIL_AUTH_TOKEN=${MAIL_AUTH_TOKEN}
    restart: unless-stopped
  front-otp:
    image: tracexapp/front
    pull_policy: never
    depends_on:
      - account-otp
    ports:
      - 8084:8084
    volumes:
      - ./branding-test.json:/app/dist/branding-test.json
    environment:
      - SERVER_PORT=8084
      - SERVER_SECRET=secret
      - ACCOUNTS_URL_INTERNAL=http://account-otp:3004
      - ACCOUNTS_URL=http://tracex.local:3004
      - FILES_URL=http://tracex.local:4031/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=http://tracex.local:4031/upload/form-data/:workspace
      - DATALAKE_URL=http://tracex.local:4031
      - PREVIEW_URL=http://tracex.local:4031
      - ELASTIC_URL=http://elastic:9200
      - GMAIL_URL=http://tracex.local:8088
      - CALENDAR_URL=http://tracex.local:8095
      - TELEGRAM_URL=http://tracex.local:8086
      - REKONI_URL=http://rekoni:4007
      - COLLABORATOR_URL=ws://tracex.local:3079
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_URL=http://tracex.local:8084/branding-test.json
      - STATS_URL=http://stats:4901
      - STATS_API=http://tracex.local:4901
      # Only needs to be non-empty: it switches the login UI to OTP mode
      - MAIL_URL=http://mail:8097
    restart: unless-stopped
