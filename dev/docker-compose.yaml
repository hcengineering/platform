services:
  stream:
    image: 'tracexapp/stream'
    extra_hosts:
      - 'tracex.local:host-gateway'
    environment:
      - STREAM_ENDPOINT_URL=datalake://tracex.local:4030
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=${SECRET}
      - STREAM_MAX_PARALLEL_SCALING_COUNT=6
      - STREAM_LOG_LEVEL=debug
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - STREAM_REGION=pg
      - STREAM_QUEUE_CONFIG=${QUEUE_CONFIG}
    ports:
      - 1080:1080
    restart: unless-stopped
  media:
    image: 'tracexapp/media'
    extra_hosts:
      - 'tracex.local:host-gateway'
    environment:
      - ACCOUNTS_URL=http://tracex.local:3000
      - SECRET=${SECRET}
      - REGION=pg
      - QUEUE_CONFIG=${QUEUE_CONFIG}
    restart: unless-stopped
  preview:
    image: 'tracexapp/preview'
    extra_hosts:
      - 'tracex.local:host-gateway'
    environment:
      - SECRET=${SECRET}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - CACHE_PATH=/data/cache
    ports:
      - 4040:4040
    restart: unless-stopped
  link-preview:
    image: 'tracexapp/link-preview'
    extra_hosts:
      - 'tracex.local:host-gateway'
    environment:
      - SECRET=${SECRET}
      - PORT=4041
    ports:
      - 4041:4041
    restart: unless-stopped
  postgres:
    image: postgres:16
    extra_hosts:
      - "tracex.local:host-gateway"
    command: ["postgres", "-p", "5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    restart: unless-stopped
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    extra_hosts:
      - 'tracex.local:host-gateway'
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --memory 512M
    volumes:
      - redpanda:/var/lib/redpanda/data
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info', '-X', 'user=superuser', '-X', 'pass=secretpassword']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:v2.8.3
    extra_hosts:
      - 'tracex.local:host-gateway'
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - 8000:8080
    depends_on:
      - redpanda
    restart: unless-stopped
  minio:
    image: 'pgsty/silo'
    command: server /data --address ":9000" --console-address ":9001"
    extra_hosts:
      - 'tracex.local:host-gateway'
    expose:
      - 9000
      - 9001
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - files:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    restart: unless-stopped
  elastic:
    image: 'elasticsearch:7.14.2'
    expose:
      - 9200
    extra_hosts:
      - 'tracex.local:host-gateway'
    volumes:
      - elastic:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx450m
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
  account:
    image: tracexapp/account
    extra_hosts:
      - 'tracex.local:host-gateway'
    links:
      - stats
    ports:
      - 3000:3000
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_SECRET=${SECRET}
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - STATS_URL=http://tracex.local:4900
      - WORKSPACE_LIMIT_PER_USER=10000
      - DB_URL=${DB_URL_PG}
      # - DB_NS=account-2
      # Pass only one region to disallow selection for new workspaces.
      - REGION_INFO=pg|PostgresDB
      - TRANSACTOR_URL=ws://tracex.local:3332;;pg,
      - MAIL_URL=
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://tracex.local:8087
      - LAST_NAME_FIRST=true
      # - WS_LIVENESS_DAYS=1
      - ACCOUNTS_URL=http://tracex.local:3000
      - BRANDING_PATH=/var/cfg/branding.json
      # - DISABLE_SIGNUP=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - MAILBOX_DOMAINS=huly.dev.local
      - MAILBOX_MAX_COUNT_PER_ACCOUNT=2
    restart: unless-stopped
  stats:
    image: tracexapp/stats
    extra_hosts:
      - 'tracex.local:host-gateway'
    ports:
      - 4900:4900
    environment:
      - PORT=4900
      - SERVER_SECRET=${SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped

  workspace_pg:
    image: tracexapp/workspace
    extra_hosts:
      - 'tracex.local:host-gateway'
    links:
      - postgres
      - minio
      - stats
    depends_on:
      redpanda:
        condition: service_started
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - WS_OPERATION=all+backup
      - REGION=pg
      - SERVER_SECRET=${SECRET}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL_PG}
      - STATS_URL=http://tracex.local:4900
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://tracex.local:3000
      - ACCOUNTS_DB_URL=${DB_URL_PG}
      - BRANDING_PATH=/var/cfg/branding.json
      - BACKUP_STORAGE=${BACKUP_STORAGE_CONFIG}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME}
      - MAIL_URL=
      # - INIT_WORKSPACE=staging-dev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  collaborator:
    image: tracexapp/collaborator
    extra_hosts:
      - 'tracex.local:host-gateway'
    links:
      - minio
      - transactor_pg
      - stats
    ports:
      - 3078:3078
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://tracex.local:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  mcp:
    image: tracexapp/mcp
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      - account
      - collaborator
      - transactor_pg
    ports:
      - 4020:4020
    environment:
      - PORT=4020
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - COLLABORATOR_URL=ws://tracex.local:3078
      - SERVICE_ID=mcp-service
      - WORKSPACE_CLIENT_CACHE_MS=0
      - STORAGE_CONFIG=${STORAGE_CONFIG}
    restart: unless-stopped
  front:
    image: tracexapp/front
    extra_hosts:
      - 'tracex.local:host-gateway'
    links:
      - stats
    ports:
      - 8087:8080
      - 8088:8080
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - STATS_URL=http://tracex.local:4900
      - FILES_URL=http://tracex.local:4030/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=/files
      - PREVIEW_URL=http://tracex.local:4040
      - GMAIL_URL=http://tracex.local:8093
      - CALENDAR_URL=http://tracex.local:8095
      - TELEGRAM_URL=http://tracex.local:8086
      - REKONI_URL=http://tracex.local:4004
      - COLLABORATOR_URL=ws://tracex.local:3078
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - PRINT_URL=http://tracex.local:4005
      - SIGN_URL=http://tracex.local:4006
      #      - ANALYTICS_COLLECTOR_URL=http://tracex.local:4017
      - DESKTOP_UPDATES_URL=https://dist.tracex.co
      - DESKTOP_UPDATES_CHANNEL=dev
      - DESKTOP_UPDATES_CHANNELS=dev;tracex:dev-tracex
      - BRANDING_URL=http://tracex.local:8087/branding.json
      - STREAM_URL=http://tracex.local:1080/recording
      - BACKUP_URL=http://tracex.local:4039/api/backup,
      - EXCLUDED_APPLICATIONS_FOR_ANONYMOUS=[]
      - DISABLED_FEATURES=auto-translate,mailboxes
      # - DISABLE_SIGNUP=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - DATALAKE_URL=http://tracex.local:4030
      - EXPORT_URL=http://tracex.local:4009
      - LINK_PREVIEW_URL=http://tracex.local:4041
    restart: unless-stopped
  transactor_pg:
    image: tracexapp/transactor
    extra_hosts:
      - 'tracex.local:host-gateway'
    links:
      - postgres
      - minio
      - account
      - stats
    depends_on:
      redpanda:
        condition: service_started
    ports:
      - 3332:3332
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_PORT=3332
      - REGION=pg
      - SERVER_SECRET=${SECRET}
      - ENABLE_COMPRESSION=true
      - FULLTEXT_URL=http://tracex.local:4702
      - STATS_URL=http://tracex.local:4900
      - DB_URL=${DB_URL_PG}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://tracex.local:8087
      - MAIL_URL=''
      - ACCOUNTS_URL=http://tracex.local:3000
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - AI_BOT_URL=http://tracex.local:4010
      - RATE_LIMIT_MAX=250 # 250 requests per 30 seconds
      - RATE_LIMIT_WINDOW=30000
      - FILES_URL=http://tracex.local:4030/blob/:workspace/:blobId/:filename
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - HYLYLAKE_URL=http://tracex.local:8096
    restart: unless-stopped
  api:
    image: tracexapp/api
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      transactor_pg:
        condition: service_started
    ports:
      - 4000:8080
    environment:
      - PORT=8080
      - TRANSACTOR_URL=ws://transactor_pg:3332
      - ACCOUNTS_URL=http://tracex.local:3000
      - SERVER_SECRET=${SECRET}
      - COLLABORATOR_URL=ws://collaborator:3078
      - LAST_NAME_FIRST=true
    restart: unless-stopped
  rekoni:
    image: tracexapp/rekoni-service
    extra_hosts:
      - 'tracex.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4004:4004
    environment:
      - SECRET=${SECRET}
      - STATS_URL=http://tracex.local:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  fulltext_pg:
    image: tracexapp/fulltext
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      elastic:
        condition: service_healthy
    restart: unless-stopped
    links:
      - elastic
      - postgres
      - rekoni
    ports:
      - 4702:4702
    environment:
      - PORT=4702
      - REGION=pg
      - SERVER_SECRET=${SECRET}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL_PG}
      - FULLTEXT_DB_URL=http://tracex.local:9200
      - ELASTIC_INDEX_NAME=local_storage_index # Same index for simplicity
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://tracex.local:4900
      - REKONI_URL=http://tracex.local:4004
      - ACCOUNTS_URL=http://tracex.local:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  print:
    image: tracexapp/print
    extra_hosts:
      - 'tracex.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4005:4005
    environment:
      - SECRET=${SECRET}
      - REGION=pg
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://tracex.local:4900
      - ACCOUNTS_URL=http://tracex.local:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - FRONT_URL=http://tracex.local:8087
  sign:
    image: tracexapp/sign
    extra_hosts:
      - 'tracex.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4006:4006
    volumes:
      - ../services/sign/pod-sign/debug/certificate.p12:/var/cfg/certificate.p12
      - ../services/sign/pod-sign/debug/branding.json:/var/cfg/branding.json
    environment:
      - SECRET=${SECRET}
      - MINIO_ENDPOINT=minio
      - REGION=pg
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://tracex.local:3000
      - CERTIFICATE_PATH=/var/cfg/certificate.p12
      - SERVICE_ID=sign-service
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://tracex.local:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  # aiBot:
  #   image: tracexapp/ai-bot
  #   ports:
  #     - 4010:4010
  #   extra_hosts:
  #     - 'tracex.local:host-gateway'
  #   restart: unless-stopped
  #   environment:
  #     - SERVER_SECRET=${SECRET}
  #     - DB_URL=${DB_URL_PG}
  #     - QUEUE_CONFIG=${QUEUE_CONFIG}
  #     - ACCOUNTS_URL=http://tracex.local:3000
  #     - STORAGE_CONFIG=${STORAGE_CONFIG}
  #     - FIRST_NAME=Jolie
  #     - LAST_NAME=AI
  #     - PASSWORD=password
  #     - AVATAR_PATH=./avatar.png
  #     - AVATAR_CONTENT_TYPE=.png
  #     - STATS_URL=http://tracex.local:4900
  # #      - LOVE_ENDPOINT=http://tracex.local:8096
  # #      - OPENAI_API_KEY=token
  analytics:
    image: tracexapp/analytics-collector
    extra_hosts:
      - 'tracex.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4017:4017
    environment:
      - SECRET=${SECRET}
      - PORT=4017
      - SERVICE_ID=analytics-collector-service
      - ACCOUNTS_URL=http://tracex.local:3000
      - STATS_URL=http://tracex.local:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      # - POSTHOG_HOST=${POSTHOG_HOST}
      # - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      # - MAX_PAYLOAD_SIZE=10mb
  export:
    image: tracexapp/export
    extra_hosts:
      - 'tracex.local:host-gateway'
    links:
      - minio
      - stats
    ports:
      - 4009:4009
    environment:
      - PORT=4009
      - SECRET=${SECRET}
      - SERVICE_ID=export-service
      - DB_URL=${DB_URL_PG}
      - STATS_URL=http://tracex.local:4900
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://tracex.local:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  datalake:
    image: tracexapp/datalake
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    ports:
      - 4030:4030
    environment:
      - PORT=4030
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - STATS_URL=http://tracex.local:4900
      - DB_URL=${DB_URL_PG}
      - BUCKETS=blobs,eu|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin
      - REGION=pg
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  hulykvs:
    image: tracexapp/hulykvs
    depends_on:
      postgres:
        condition: service_started
    extra_hosts:
      - 'tracex.local:host-gateway'
    ports:
      - 8094:8094
    environment:
      - HULY_DB_CONNECTION=${DB_URL_PG}
      - HULY_TOKEN_SECRET=${SECRET}
    restart: unless-stopped
  hulygun:
    image: tracexapp/hulygun
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
    extra_hosts:
      - 'tracex.local:host-gateway'
    environment:
      - HULY_LOG=debug
      - HULY_KAFKA_BOOTSTRAP=redpanda:9092
      - HULY_TOKEN_SECRET=${SECRET}
      - HULY_ACCOUNT_SERVICE=http://tracex.local:3000
    restart: unless-stopped

  process-service:
    image: tracexapp/process
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
    environment:
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=pg
    restart: unless-stopped

  time-machine:
    image: tracexapp/worker
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      postgres:
        condition: service_started
    environment:
      - DB_URL=${DB_URL_PG}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=pg
    restart: unless-stopped
  events-processor:
    image: tracexapp/events-processor
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
    environment:
      - SERVICE_ID=events-processor
      - LOG_LEVEL=debug
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://huly.local:3000
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=pg
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  backup-pg:
    image: tracexapp/backup
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    environment:
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - ACCOUNTS_DB_URL=${DB_URL_PG}
      - STATS_URL=http://tracex.local:4900
      - DB_URL=${DB_URL_PG}
      - REGION=pg
      - BUCKET_NAME=backups
      - INTERVAL=60
      - STORAGE=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - WORKSPACE_STORAGE=${STORAGE_CONFIG}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - TEMPORAL_ADDRESS=localhost:7233
    restart: unless-stopped
  backup-api:
    image: tracexapp/backup-api
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      stats:
        condition: service_started
      account:
        condition: service_started
    ports:
      - 4039:4039
    environment:
      - PORT=4039
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - STATS_URL=http://tracex.local:4900
      - BUCKET_NAME=backups
      - STORAGE=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:latest
    extra_hosts:
      - 'tracex.local:host-gateway'
    ports:
      - 16686:16686 # Web UI
      - 4317:4317
      - 4318:4318
    volumes:
      - telemetry:/badger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    restart: unless-stopped
volumes:
  db:
  dbpg:
  files:
  elastic:
  postgres_db:
  redpanda:
  telemetry:
