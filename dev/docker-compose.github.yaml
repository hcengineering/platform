# Dev-overlay to run github-next service.
#
# Usage from dev/ directory:
#   docker compose -f docker-compose.yaml -f docker-compose.github.yaml up -d
#
services:
  github-next:
    image: tracexapp/github-next-service
    extra_hosts:
      - 'tracex.local:host-gateway'
    depends_on:
      account:
        condition: service_started
      redpanda:
        condition: service_started
      transactor_pg:
        condition: service_started
    ports:
      - 3510:3510
    environment:
      - SERVICE_ID=github-next-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://tracex.local:3000
      - FRONT_URL=http://tracex.local:8087
      - COLLABORATOR_URL=ws://tracex.local:3078
      - PORT=3510
      - PUBLIC_URL=http://tracex.local:3510
      - CLIENT_ID=Ov23liv6hK0ifBRInXFz
      - CLIENT_SECRET=e1832f57c6432350126bc97f7ea5c7c87374e0a5
      - POLL_INTERVAL_MS=30000
      - OUTBOUND_DEBOUNCE_MS=1000
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=pg
      - SYNC_INBOUND=true
      - SYNC_OUTBOUND=true
    restart: unless-stopped
  front:
    environment:
      - GITHUB_URL=http://tracex.local:3500
      - GITHUB_NEXT_CLIENTID=Ov23liv6hK0ifBRInXFz
      - GITHUB_NEXT_URL=http://tracex.local:3510
