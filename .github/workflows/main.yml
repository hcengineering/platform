  uitest-report:
    if: ${{ !cancelled() }}
    needs: [uitest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML report
        run: npx -y playwright@1.64.1 merge-reports --reporter html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: playwright-report/
  uitest-qms:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: qms-gh-pages-${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s')) && 'publish' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Checking for mis-matching dependencies...
        run: node common/scripts/install-run-rush.js check

      - name: Checking for mis-matching transitive dependencies...
        run: node common/scripts/check-versions.js

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Login to Docker Hub
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Docker Build
        run: node common/scripts/install-run-rush.js docker
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_BUILDKIT: 1
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 tracex.local" | sudo tee -a /etc/hosts
      - name: Prepare server
        run: |
          cd ./qms-tests
          export DO_CLEAN=true
          ./prepare.sh
      - name: Install Playwright
        run: |
          cd ./qms-tests/sanity
          node ../../common/scripts/install-run-rushx.js ci
      - name: Run UI tests
        run: |
          cd ./qms-tests/sanity
          node ../../common/scripts/install-run-rushx.js uitest
      - name: 'Store docker logs'
        if: always()
        run: |
          cd ./qms-tests/sanity
          mkdir logs
          cd logs
          docker ps -a --format '{{.Names}}' | xargs -I {} sh -c 'docker logs {} > {}_logs.log 2>&1'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-qms
          path: ./qms-tests/sanity/playwright-report/
      - name: Publish QMS report to gh-pages
        if: ${{ always() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s')) && hashFiles('qms-tests/sanity/playwright-report/index.html') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./qms-tests/sanity/playwright-report
          destination_dir: qms/${{ startsWith(github.ref, 'refs/tags/v') && 'v' || 's' }}/${{ github.ref_name }}
          keep_files: true
      - name: Update latest QMS report pointer
        if: ${{ always() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s')) && hashFiles('qms-tests/sanity/playwright-report/index.html') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./qms-tests/sanity/playwright-report
          destination_dir: qms/${{ startsWith(github.ref, 'refs/tags/v') && 'v' || 's' }}/latest
          keep_files: true
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-logs-qms
          path: ./qms-tests/sanity/logs
  uitest-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Checking for mis-matching dependencies...
        run: node common/scripts/install-run-rush.js check

      - name: Checking for mis-matching transitive dependencies...
        run: node common/scripts/check-versions.js

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Build sanity-tests suite
        run: node common/scripts/install-run-rush.js build -t @hcengineering/tests-sanity

      - name: Login to Docker Hub
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Docker Build
        run: node common/scripts/install-run-rush.js docker
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_BUILDKIT: 1
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 tracex.local" | sudo tee -a /etc/hosts
      - name: Prepare server
        run: |
          cd ./ws-tests
          export DO_CLEAN=true
          ./prepare.sh
      - name: Run API tests
        run: |
          cd ./ws-tests/api-tests
          node ../../common/scripts/install-run-rush.js validate --to @hcengineering/api-tests
          node ../../common/scripts/install-run-rushx.js api-test --verbose
      - name: Install Playwright
        run: |
          cd ./ws-tests/sanity
          node ../../common/scripts/install-run-rushx.js ci
      - name: Run UI tests
        run: |
          cd ./ws-tests/sanity
          node ../../common/scripts/install-run-rushx.js uitest
      - name: 'Store docker logs'
        if: always()
        run: |
          cd ./ws-tests/sanity
          mkdir logs
          cd logs
          docker ps -a --format '{{.Names}}' | xargs -I {} sh -c 'docker logs {} > {}_logs.log 2>&1'
      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-api
          path: ./ws-tests/api-tests/playwright-report/
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-ws
          path: ./ws-tests/sanity/playwright-report/
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-logs-ws
          path: ./ws-tests/sanity/logs
  workspace-init-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Checking for mis-matching dependencies...
        run: node common/scripts/install-run-rush.js check

      - name: Checking for mis-matching transitive dependencies...
        run: node common/scripts/check-versions.js

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Build sanity-tests suite
        run: node common/scripts/install-run-rush.js build -t @hcengineering/tests-sanity

      - name: Login to Docker Hub
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Docker Build
        run: node common/scripts/install-run-rush.js docker
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_BUILDKIT: 1
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 tracex.local" | sudo tee -a /etc/hosts
      - name: Init data e2e (workspace service creates a workspace from the init script)
        run: |
          cd ./ws-tests
          ./init-data-test.sh
        env:
          INIT_SCRIPTS_BRANCH: ${{ env.INIT_SCRIPTS_BRANCH }}
      - name: 'Store docker logs'
        if: always()
        run: |
          mkdir -p ws-tests/logs
          cd ws-tests/logs
          docker ps -a --format '{{.Names}}' | xargs -I {} sh -c 'docker logs {} > {}_logs.log 2>&1'
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-logs-init-data
          path: ./ws-tests/logs
  docker-build:
    needs: [uitest-workspaces]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Configure docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Checkout init repository
        run: |
          wget https://github.com/hcengineering/init/archive/refs/heads/${{env.INIT_SCRIPTS_BRANCH}}.zip
          unzip ${{env.INIT_SCRIPTS_BRANCH}}.zip -d pods/workspace
          mv pods/workspace/init-${{env.INIT_SCRIPTS_BRANCH}} pods/workspace/init
          rm -rf ${{env.INIT_SCRIPTS_BRANCH}}.zip

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-platform
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Installing...
        run: node common/scripts/install-run-rush.js install

      - name: Model version from git tags
        run: node common/scripts/install-run-rush.js model-version

      - name: Login to Docker Hub
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Download Syft
        if: startsWith(github.event.inputs.ref || github.ref, 'refs/tags/v') || startsWith(github.event.inputs.ref || github.ref, 'refs/tags/s')
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Add Syft to PATH
        if: startsWith(github.event.inputs.ref || github.ref, 'refs/tags/v') || startsWith(github.event.inputs.ref || github.ref, 'refs/tags/s')
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

      - name: Docker build
        run: |
          node common/scripts/install-run-rush.js docker:build -v
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_EXTRA: --platform=linux/amd64,linux/arm64
          DOCKER_BUILDKIT: 1
          DOCKER_BUILD_CLEANUP: true

      - name: Clean Docker build cache
        run: docker builder prune -a -f

      - name: Login to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s') }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      # - name: Docker push staging
      #   if: ${{ github.ref == 'refs/heads/main' }}
      #   run: node common/scripts/install-run-rush.js docker:staging -v
      - name: Docker push tag
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s')) && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true') }}
        run: |
          echo Pushing release of tag ${{ github.ref }}
          node common/scripts/install-run-rush.js docker:push -v

      - name: Generate Docker image SBOMs
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s')) && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true') }}
        continue-on-error: true
        run: |
          node common/scripts/install-run-rush.js docker:sbom -v
        env:
          SBOM_OUTPUT_DIR: ${{ github.workspace }}/sbom/docker

      - name: Upload Docker image SBOMs
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s')) && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true') }}
        uses: actions/upload-artifact@v6
        with:
          name: sbom-docker-images
          path: sbom/docker/*.spdx.json

  qms-dist-build:
    # if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s') }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s') }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: node
        with:
          path: |
            common/temp
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Installing...
        run: node common/scripts/install-run-rush.js install --purge
      - name: Model version from git tags
        run: node common/scripts/install-run-rush.js model-version
      - name: Package
        run: node common/scripts/install-run-rush.js package --to qms-desktop -v
      - name: Bump package JSON version
        run: |
          cd qms-desktop-package
          node ../common/scripts/install-run-rushx.js bump
          cat ./package.json
      - name: Install the Apple certificate and provisioning profile
        env:
          DEV_ID_P12_BASE64: ${{ secrets.DEV_ID_P12_BASE64 }}
          DEV_ID_P12_PASSWORD: ${{ secrets.DEV_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate from secret
          echo -n "$DEV_ID_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEV_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Build distribution's
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASS: ${{ secrets.APPLE_ID_APP_PASS }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd qms-desktop-package
          if [[ "${GITHUB_REF_NAME}" =~ ^s[0-9] ]]; then
            variant=staging
            dist_command=dist-staging
            signed_command=dist-staging-signed
          else
            variant=prod
            dist_command=dist
            signed_command=dist-signed
          fi
          node ../common/scripts/install-run-rushx.js "$dist_command" --linux --x64
          node ../common/scripts/install-run-rushx.js "$dist_command" --windows --x64 --arm64
          node ../common/scripts/install-run-rushx.js "$signed_command" --macos --x64 --arm64
          ./scripts/copy-publish-artifacts.sh ${{ env.PublishTempFolder}} "$variant"
      - name: Publish distribution assets and version
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "5"
        run: |
          # Classic transfer client instead of CRT (CRT fails with FIRST_BYTE_TIMEOUT on big uploads)
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.cli_read_timeout 0
          aws configure set default.cli_connect_timeout 60
          aws configure set default.s3.max_concurrent_requests 4
          aws configure set default.s3.multipart_threshold 128MB
          aws configure set default.s3.multipart_chunksize 64MB
          # Binaries first, manifests last and only after the uploaded sizes are verified
          bash qms-desktop-package/scripts/upload-dist.sh "qms-desktop-package/${{ env.PublishTempFolder }}" \
            "${{ secrets.DIST_S3_BUCKET }}" "${{ secrets.S3_ENDPOINT }}"
      - name: Upload MacOS
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/s') && 'TraceX-Staging-MacOS-x64' || 'TraceX-MacOS-x64' }}
          path: ./qms-desktop-package/deploy/TraceX*-macos-*-x64.dmg
      - name: Upload MacOS arm64
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/s') && 'TraceX-Staging-MacOS-arm64' || 'TraceX-MacOS-arm64' }}
          path: ./qms-desktop-package/deploy/TraceX*-macos-*-arm64.dmg
      - name: Upload Windows
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/s') && 'TraceX-Staging-Windows' || 'TraceX-Windows' }}
          path: ./qms-desktop-package/deploy/TraceX*-windows-*.zip
      - name: Upload Linux
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/s') && 'TraceX-Staging-Linux' || 'TraceX-Linux' }}
          path: ./qms-desktop-package/deploy/TraceX*-linux-*.zip

  publish-npm:
    if: startsWith(github.event.inputs.ref || github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-platform
        with:
          path: common/temp
          key: ${{ runner.os }}-build-cache-node-platform-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-build-cache-node-platform-
      - name: Installing...
        run: node common/scripts/install-run-rush.js install
      - name: Prepare npm package versions
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || github.ref }}"
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm packages can only be published from a vMAJOR.MINOR.PATCH production tag."
            exit 1
          fi
          VERSION="${REF#refs/tags/v}"
          node common/scripts/bump.js "$VERSION"
          node common/scripts/bump.js --check "$VERSION"
      - name: Building...
        run: node common/scripts/install-run-rush.js build
      - name: Emit TypeScript declarations
        run: node common/scripts/install-run-rush.js validate
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/common/config/rush/.npmrc-publish
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          node common/scripts/safe-publish.js
