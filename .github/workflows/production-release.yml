name: Create production release

# Manually triggered workflow: promotes staging-new into main, tags the
# result with the specified vX.Y.Z production version, and feeds the existing
# release pipeline in main.yml. It does not deploy anything by itself.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Production version to release (e.g. v0.7.427)'
        type: string
        required: true
      update_changelog:
        description: 'Generate changelog.md with git-cliff before tagging'
        type: boolean
        default: false
      dry_run:
        description: 'Validate the version and merge locally, but do not push anything'
        type: boolean
        default: false

permissions:
  # Push happens over the SSH deploy key, not GITHUB_TOKEN — read is enough.
  contents: read

# Only one production release may run at a time, and never cancel one mid-push.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: tree:0
          # A GITHUB_TOKEN push cannot trigger main.yml. The deploy key makes
          # the branch/tag push an ordinary external push instead.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch staging-new
        run: git fetch origin staging-new --tags

      - name: Merge staging-new into main
        run: |
          set -euo pipefail
          if ! git merge --no-edit origin/staging-new; then
            echo "::error::Merge conflict while merging origin/staging-new into main. Resolve it manually and re-run."
            git merge --abort
            exit 1
          fi

      - name: Validate production tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production version must have the format vMAJOR.MINOR.PATCH (e.g. v0.7.427)."
            exit 1
          fi

          # Only consider well-formed vMAJOR.MINOR.PATCH tags.
          LATEST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "::error::Tag $RELEASE_VERSION already exists."
            exit 1
          fi

          echo "Previous tag: ${LATEST:-none}"
          echo "Release tag: $RELEASE_VERSION"
          echo "tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=${LATEST:-none}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        if: ${{ inputs.update_changelog == true }}
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Update changelog
        if: ${{ inputs.update_changelog == true }}
        run: |
          set -euo pipefail
          git-cliff --tag "${{ steps.version.outputs.tag }}" -o ./changelog.md
          git add changelog.md
          if git diff --cached --quiet; then
            echo "Changelog is already up to date."
          else
            git commit -m "chore(release): update changelog"
          fi

      - name: Update release versions
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          printf '"%s"\n' "$VERSION" > common/scripts/version.txt
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          for filename in (
              'desktop/package.json',
              'desktop-package/package.json',
              'qms-desktop-package/package.json',
          ):
              path = Path(filename)
              content = path.read_text()
              updated, count = re.subn(
                  r'(?m)^([ \t]*"version": ")[^"]+("[,])',
                  lambda match: f'{match.group(1)}{version}{match.group(2)}',
                  content,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f'Could not update version in {filename}')
              path.write_text(updated)
          PY
          git add common/scripts/version.txt desktop/package.json desktop-package/package.json qms-desktop-package/package.json
          if git diff --cached --quiet; then
            echo "Release versions are already up to date."
          else
            git diff --cached --stat
            git commit -m "chore(release): update versions to $VERSION"
          fi

      - name: Create production tag
        run: git tag -a "${{ steps.version.outputs.tag }}" -m "Production release ${{ steps.version.outputs.tag }}"

      - name: Push main and production tag
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git push origin main
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Production release"
            echo "- Previous tag: \`${{ steps.version.outputs.previous }}\`"
            echo "- New tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- Changelog updated: \`${{ inputs.update_changelog }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
